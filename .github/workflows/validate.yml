name: Validate library

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validation dependency
        run: python -m pip install -r requirements-validation.txt
      - name: Validate manifest and declarative profiles
        run: python scripts/validate_library.py && python scripts/validate_schemas.py
